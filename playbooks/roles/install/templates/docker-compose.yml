services:
  tw:
    image: sfgrp/taxonworks:latest
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: {{ tw_cpus_limit }}
          memory: {{ tw_memory_limit }}
    environment:
      - RAILS_ENV=production
      - SERVER_NAME={{ hostname }}.{{ domain }}
      - POSTGRES_HOST=db
      - POSTGRES_DB=taxonworks_production
      - POSTGRES_USER=taxonworks_production
      - POSTGRES_PASSWORD={{ postgres_password }}
      - POSTGRES_POOL_SIZE={{ postgres_pool_size }}
      - NGINX_SECRET_KEY={{ nginx_secret_key }}
      - SECRET_KEY_BASE={{ secret_key_base }}
      - TW_EXCEPTION_NOTIFICATION_EMAIL_PREFIX={{ tw_exception_notification_email_prefix }}
      - TW_EXCEPTION_NOTIFICATION_SENDER_ADDRESS="{{ tw_exception_notification_sender_address }}"
      - TW_EXCEPTION_RECIPIENTS={{ tw_admin_emails | join(',') }}
{% if _smtp_address | default('') != '' %}
      - TW_ACTION_MAILER_SMTP_SETTINGS_ADDRESS={{ _smtp_address }}
      - TW_ACTION_MAILER_SMTP_SETTINGS_PORT={{ _smtp_port }}
      - TW_ACTION_MAILER_SMTP_SETTINGS_DOMAIN={{ hostname }}.{{ domain }}
      - TW_ACTION_MAILER_SMTP_SETTINGS_USER_NAME={{ _smtp_user }}
      - TW_ACTION_MAILER_SMTP_SETTINGS_PASSWORD={{ _smtp_password }}
      - TW_ACTION_MAILER_SMTP_SETTINGS_AUTHENTICATION_TYPE={{ _smtp_auth }}
{% endif %}
      - TW_ACTION_MAILER_URL_HOST={{ tw_action_mailer_url_host }}
      - TW_MAIL_DOMAIN={{ tw_mail_domain }}
      - TW_PATHS_STAGING=/staging
      - TW_PATHS_BACKUP=/backups
    healthcheck:
      test: ["CMD", "exe/docker_health_check.sh", "300", "80"]
      timeout: 305s
      interval: 10s
      retries: 3
    ports:
      - '0.0.0.0:80:80'
      - '0.0.0.0:443:443'
    links:
      - db
    volumes:
     - /var/lib/taxonworks/logs:/app/log:rw
     - /var/lib/taxonworks/public:/app/public:rw
     - /var/lib/taxonworks/downloads:/app/downloads:rw
     - /var/lib/taxonworks/data:/var/lib/postgresql/data
     - /backups:/backups:rw
     - /staging:/staging:rw
     - /app/config:/app/config:rw
{% if enable_ssl | default(false) %}
     - /etc/letsencrypt:/etc/letsencrypt:ro
     - /var/lib/letsencrypt:/var/lib/letsencrypt:rw
{% endif %}
    stdin_open: true
    tty: true
  maintenance:
    image: nginx:alpine
    restart: "no"
    profiles: ["maintenance"]
    ports:
      - '0.0.0.0:80:80'
    volumes:
      - /var/lib/taxonworks/public/maintenance.html:/usr/share/nginx/html/maintenance.html:ro
      - /app/config/maintenance.nginx.conf:/etc/nginx/conf.d/default.conf:ro
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: {{ postgres_cpus_limit }}
          memory: {{ postgres_memory_limit }}
    shm_size: {{ postgres_shm_size}}
    environment:
      - POSTGRES_PASSWORD={{ postgres_password }}
      - POSTGRES_USER=taxonworks_production
      - POSTGRES_DB=taxonworks_production
    ports:
      - '0.0.0.0:15432:5432'
    volumes:
      - /var/lib/taxonworks/data:/var/lib/postgresql/data
