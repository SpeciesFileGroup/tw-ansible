---
# Usage:
#   ansible-playbook playbooks/maintenance.yml -e state=on     # enable maintenance mode
#   ansible-playbook playbooks/maintenance.yml -e state=off    # disable maintenance mode
#
# Maintenance mode stops the tw container and runs a small nginx sidecar
# ("maintenance" service in docker-compose.yml) that serves maintenance.html
# on port 80 with HTTP 503. Turning it off stops the sidecar and restarts tw.

- name: Fail if state is not specified
  fail:
    msg: "Required: -e state=on or -e state=off"
  when: state is not defined or state not in ['on', 'off']

- name: Stop TaxonWorks container
  become: true
  become_user: tw
  command: docker compose stop tw
  args:
    chdir: /app
  when: state == "on"

- name: Start maintenance sidecar
  become: true
  become_user: tw
  command: docker compose --profile maintenance up -d maintenance
  args:
    chdir: /app
  when: state == "on"

- name: Show maintenance on message
  debug:
    msg: "Maintenance mode ON. Sidecar nginx is serving /var/lib/taxonworks/public/maintenance.html on port {{ tw_port }}."
  when: state == "on"

- name: Stop maintenance sidecar
  become: true
  become_user: tw
  command: docker compose stop maintenance
  args:
    chdir: /app
  when: state == "off"

- name: Start TaxonWorks container
  become: true
  become_user: tw
  command: docker compose start tw
  args:
    chdir: /app
  when: state == "off"

- name: Wait for TaxonWorks to be healthy
  become: true
  become_user: tw
  command: docker inspect --format '{{ "{{" }} .State.Health.Status {{ "}}" }}' app-tw-1
  register: tw_health
  changed_when: false
  retries: 120
  delay: 10
  until: tw_health.stdout == "healthy"
  when: state == "off"

- name: Show maintenance off message
  debug:
    msg: "Maintenance mode OFF. TaxonWorks is back up."
  when: state == "off"
