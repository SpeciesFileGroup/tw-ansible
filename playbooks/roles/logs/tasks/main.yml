---
# Usage:
#   ansible-playbook playbooks/logs.yml                              # last 100 lines of production.log
#   ansible-playbook playbooks/logs.yml -e lines=500                 # last 500 lines
#   ansible-playbook playbooks/logs.yml -e grep="SomeError"          # grep for a pattern
#   ansible-playbook playbooks/logs.yml -e log=backup                # view backup.log instead

- name: Set defaults
  set_fact:
    _lines: "{{ lines | default(100) }}"
    _log: "{{ log | default('production') }}"

- name: Tail log file
  become: true
  become_user: tw
  command: "tail -n {{ _lines }} /var/lib/taxonworks/logs/{{ _log }}.log"
  register: log_output
  changed_when: false
  failed_when: false
  when: grep is not defined

- name: Grep log file
  become: true
  become_user: tw
  shell: "grep -i '{{ grep }}' /var/lib/taxonworks/logs/{{ _log }}.log | tail -n {{ _lines }}"
  register: grep_output
  changed_when: false
  failed_when: false
  when: grep is defined

- name: Show log output
  debug:
    msg: "{{ (log_output.stdout_lines | default(grep_output.stdout_lines | default(['No output']))) }}"
