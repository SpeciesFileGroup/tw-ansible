---
# Usage:
#   ansible-playbook playbooks/restore.yml -e restore_file=/path/to/local/backup.dump
#   ansible-playbook playbooks/restore.yml -e restore_from_remote=/backups/some_backup.dump

- name: Fail if no restore file specified
  fail:
    msg: "Specify either restore_file (local path to upload) or restore_from_remote (path on server in /backups)"
  when: restore_file is not defined and restore_from_remote is not defined

- name: Set backup filename for upload
  set_fact:
    _restore_filename: "{{ restore_file | basename }}"
  when: restore_file is defined

- name: Set backup filename for remote file
  set_fact:
    _restore_filename: "{{ restore_from_remote | basename }}"
  when: restore_from_remote is defined

- name: Copy local backup file to server
  become: true
  become_user: root
  copy:
    src: "{{ restore_file }}"
    dest: "/backups/{{ _restore_filename }}"
    owner: tw
    group: tw
    mode: '0644'
  when: restore_file is defined

- name: Run a backup before restoring
  become: true
  become_user: tw
  command: docker exec -i app-tw-1 /app/bin/rake tw:db:dump
  args:
    chdir: /app

- name: Stop TaxonWorks container
  become: true
  become_user: tw
  command: docker compose stop tw
  args:
    chdir: /app

- name: Start maintenance sidecar
  become: true
  become_user: tw
  command: docker compose --profile maintenance up -d maintenance
  args:
    chdir: /app

- name: Wait for container to stop
  pause:
    seconds: 10

- name: Detect if restore file is a zip archive
  set_fact:
    _is_zip: "{{ _restore_filename | lower | regex_search('\\.zip$') is not none }}"

- name: "Dump restore: Restore database from pg_dump file"
  become: true
  become_user: tw
  command: >
    docker compose run --rm --entrypoint ""
    -e PGPASSWORD={{ postgres_password }}
    -e RAILS_ENV=production
    -e DISABLE_DATABASE_ENVIRONMENT_CHECK=1
    tw rake tw:db:restore backup_directory=/backups file={{ _restore_filename }} database_host=db
  args:
    chdir: /app
  environment:
    DISABLE_DATABASE_ENVIRONMENT_CHECK: "1"
    RAILS_ENV: production
  when: not _is_zip

- name: "Zip restore: Unzip archive into /backups/_unzipped"
  become: true
  become_user: tw
  command: >
    docker compose run --rm --entrypoint "" tw
    bash -c "rm -rf /backups/_unzipped && mkdir -p /backups/_unzipped && unzip -o /backups/{{ _restore_filename }} -d /backups/_unzipped"
  args:
    chdir: /app
  when: _is_zip

- name: "Zip restore: Locate .sql file inside archive"
  become: true
  become_user: tw
  command: >
    docker compose run --rm --entrypoint "" tw
    bash -c "find /backups/_unzipped -type f -name '*.sql' | head -1"
  args:
    chdir: /app
  register: _sql_find
  changed_when: false
  when: _is_zip

- name: "Zip restore: Fail if no .sql file found"
  fail:
    msg: "No .sql file found inside {{ _restore_filename }}"
  when: _is_zip and (_sql_find.stdout | trim) == ""

- name: "Zip restore: Drop, recreate database, and import SQL"
  become: true
  become_user: tw
  command: >
    docker compose run --rm --entrypoint ""
    -e PGPASSWORD={{ postgres_password }}
    tw bash -c "psql -h db -U taxonworks_production -d postgres -c 'DROP DATABASE IF EXISTS taxonworks_production;' && psql -h db -U taxonworks_production -d postgres -c 'CREATE DATABASE taxonworks_production OWNER taxonworks_production;' && psql -h db -U taxonworks_production -d taxonworks_production -v ON_ERROR_STOP=1 -f {{ _sql_find.stdout | trim }}"
  args:
    chdir: /app
  when: _is_zip

- name: "Zip restore: Clean up unzipped files"
  become: true
  become_user: tw
  command: >
    docker compose run --rm --entrypoint "" tw
    bash -c "rm -rf /backups/_unzipped"
  args:
    chdir: /app
  when: _is_zip

- name: Stop maintenance sidecar
  become: true
  become_user: tw
  command: docker compose stop maintenance
  args:
    chdir: /app

- name: Start TaxonWorks container
  become: true
  become_user: tw
  command: docker compose start tw
  args:
    chdir: /app

- name: Wait for TaxonWorks to be healthy
  become: true
  become_user: tw
  command: docker inspect --format '{{ "{{" }} .State.Health.Status {{ "}}" }}' app-tw-1
  register: tw_health
  changed_when: false
  retries: 120
  delay: 10
  until: tw_health.stdout == "healthy"
