---
# Usage:
#   ansible-playbook playbooks/restart.yml                          # restart all containers
#   ansible-playbook playbooks/restart.yml -e service=tw            # restart only TaxonWorks
#   ansible-playbook playbooks/restart.yml -e service=db            # restart only PostgreSQL

- name: Restart all containers
  become: true
  become_user: tw
  command: docker compose restart
  args:
    chdir: /app
  when: service is not defined

- name: "Restart {{ service }} container"
  become: true
  become_user: tw
  command: "docker compose restart {{ service }}"
  args:
    chdir: /app
  when: service is defined

- name: Wait for TaxonWorks to be healthy
  become: true
  become_user: tw
  command: docker inspect --format '{{ "{{" }} .State.Health.Status {{ "}}" }}' app-tw-1
  register: tw_health
  changed_when: false
  retries: 120
  delay: 10
  until: tw_health.stdout == "healthy"
